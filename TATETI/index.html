<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tateti</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="title">Tateti</h1>
      <div class="status" id="status">Turno de <span class="player-x">X</span></div>
    </header>

    <main class="app-main">
      <div class="board" id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
      </div>

      <div class="controls">
        <button class="btn" id="restart-btn">Reiniciar partida</button>
        <button class="btn btn-secondary" id="reset-score-btn">Reiniciar marcador</button>
      </div>
    </main>

    <footer class="app-footer">
      <div class="scoreboard">
        <div class="score score-x">
          <span class="score-label">X</span>
          <span class="score-value" id="score-x">0</span>
        </div>
        <div class="score score-draw">
          <span class="score-label">Empates</span>
          <span class="score-value" id="score-draw">0</span>
        </div>
        <div class="score score-o">
          <span class="score-label">O</span>
          <span class="score-value" id="score-o">0</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
